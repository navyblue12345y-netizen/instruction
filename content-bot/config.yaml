    semantic_backend: deepseek
    auto_fix_backend: claude
    auto_fix_max_attempts: 1
    severity_overrides: {S001: BLOCK, M003: WARN, M007: WARN, D001: BLOCK, D004: BLOCK, D010: BLOCK}
  rewrite_backend: claude
  cost:
    daily_ceiling_usd: 30
