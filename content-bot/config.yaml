# --- Уведомления об опасности БПЛА (тестовое включение 24.08) ---------------
# 20 каналов на обкатку; выключить = enabled: false (без рестарта, конфиг
# перечитывается каждый тик). Полная сетка = убрать channels.
bpla_alerts:
  enabled: true
  interval_seconds: 25
  min_gap_minutes: 20        # события одного канала не чаще раза в 20 минут
  quiet_minutes: 60          # час тишины после рекламы (требование 24.08)
  own_post_gap_minutes: 5    # пауза после ОБЫЧНОГО поста канала (24.08)
  # 26.08 (yuzer): raskat na VSE kanaly obeikh setok — 252 s geo.
  # Spisok 92 snyat; '*' = vse aktivnye. Vernut vyborochno: spisok iz bekapa.
  channels: '*'
