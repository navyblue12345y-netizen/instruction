  # половина фетчей срывалась, источник отбрасывался (retries=1) -> 500+
  # ложных TimeoutError/час и потеря кандидатов. Для web пол max(t,15) частично
  # спасал, у VK/TG/MAX пола нет — их резало сильнее всего.
  per_source_timeout_sec: 20
  per_source_retries: 1
  # 2026-08-07: раздельные очереди фетча (симуляция A/B/C на staging:
  # web16 даёт +45% кандидатов при той же волне; vk/max таймауты 294/51 -> 212/0).
  web_fetch_concurrency: 16
  vk_fetch_concurrency: 12
  max_pub_age_hours: 48   # Bug #9 (2026-05-21): drop candidates with pub_time > 48h ago
                           # (применяется и при выборе из pool, и при INSERT в pool).
slot_monitor:
  enabled: true
  # 2026-07-31: тестовые каналы публикуются вне prepared_pipeline — не мониторим
  exclude_channels:
    - test_novostniki_v_max
  tg_bot_token_env: TELEGRAM_ALERT_BOT_TOKEN
  tg_alert_chat_id: -1003845321246
  tg_digest_chat_id: -1003751029280
  recovery_emoji: 👍
  silence_default_hours: 4
  retry_cooldown_seconds: 60
  buffer_minutes: 30
  consecutive_threshold: 2
  recovery_consecutive_threshold: 2
  periodic_digest_enabled: true
  periodic_digest_interval_hours: 2
  periodic_digest_quiet_start_utc: 19
  periodic_digest_quiet_end_utc: 5
  critical_percent_threshold: 50
  dry_run_retry: false
  tick_interval_seconds: 300
  digest_utc_hour: 18
  daily_reset_utc_hour: 0

# Bug #16 (2026-05-21): После Bug #11 split (slot_metrics.db выделена) notifier
# читает только новую БД, поэтому слоты до cutover (11:53 МСК сегодня) видны
# как MISSED_SILENT — ложные критические алерты. skip_alerts_before подавляет
# и сами alerts (по wall-clock) и счётчики passed_today для слотов до этого
# момента. Установить = None / убрать ключ после 00:00 МСК след. дня.
notifier:
  skip_alerts_before: "2026-05-21T19:00:00+03:00"   # МСК — silence до этого времени (Bug #16 после Bug #11 split)
slot_shift:
  enabled: true
  dry_run: false
  ad_lookback_minutes: 90
  detect_buffer_minutes: 5

prepared_pipeline:
  # 2026-07-31: сдвиг старта волны — реклама, положенная ровно в :00 по всей
  # сетке, успевает задетектиться watcher'ом (25-60с) ДО первой публикации.
  publish_delay_seconds: 180
  # Re-prepare (2026-07-27): вторая попытка для погибших слотов
  # (filter_reject/failed/no_candidate/зомби-pending + дубль-скип publisher).
  # Война-волна 27.07 убила 47 слотов; дубль-скипы теряли ~24 слота/день.
  re_prepare:
    enabled: true
    max_retries: 1
    window_minutes: 25
    delay_minutes: 5
  media_autocrop: false   # ВЫКЛ 24.06 — детектор режет светлые фото (снег/небо/белый фон), дорабатывается
  enabled: true                           # CANARY 29.05 — проверка Bug AT убрал ✨. Откат: enabled false + рестарт
  # CANARY whitelist 3 канала. Полный (вернуть при success):
  #   - '__GRID__:Города лайв'
  #   - '__GRID__:Города в MAX'
  enabled_channels:
    - '__GRID__:Города лайв'
    - '__GRID__:Города в MAX'
  preparer_interval_seconds: 60
  publisher_interval_seconds: 5
  # slotfix 2026-07-13: окно publish-time дедупа (дни). Preparer проверяет 30д
  # при подготовке; на публикации — страховка от соседних слотов и медленных перепечаток.
  publish_dedup_days: 5
  lookahead_minutes: 180
  max_retries: 3
  stuck_preparing_timeout_minutes: 5
  stuck_publishing_timeout_seconds: 30
  stale_window_minutes: 30
  publisher_batch_size: 300
  # 2026-08-07: 1800 -> 14400. Живой замер (4 токена, проверки в 0/60/120/240
  # мин постом в тест-канал): токен возрастом 4 ЧАСА жив. TTL 30 мин заставлял
  # 757 постов/день делать повторную заливку в гуще волны -> шторм /uploads,
  # 1100+ таймаутов, ~180 постов/день выходили без фото (text-only fallback).
  max_token_ttl_seconds: 14400

ad_detection:
  enabled: true                 # ВКЛЮЧЁН 17.06 (заменил legacy _collect_external_ads_by_slots)
  tick_seconds: 30              # частота сканирования в активных окнах
  window_before_min: 5          # начало окна детекта до ad_hour
  window_after_min: 30          # конец окна детекта после ad_hour
  max_messages_per_channel: 5   # сколько последних сообщений запрашивать через list_messages
  bot_mids_ttl_hours: 48        # TTL для очистки bot_posted_mids

