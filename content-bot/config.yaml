# MAX ad-cover (24.06) — детект ВНЕплановой рекламы (watcher long-poll
# /updates) + перекрытие cover-постом через delay_minutes (обход ad_guard).
# Dark launch. Spec: docs/superpowers/specs/2026-06-24-max-ad-cover-design.md
max_ad_cover:
  # 2026-07-27: плановая реклама, не перекрытая штатным слотом за grace
  # (60 мин в топе свято + 15 форы слоту/re-prepare) — перекрывается cover'ом.
  planned_grace_minutes: 75
  enabled: true                   # dark launch — вкл после live-теста + подтверждения
  delay_minutes: 60                # реклама «отвисает» час, потом крывается
  watcher_poll_timeout_seconds: 30
  tick_interval_seconds: 60
  max_cover_age_minutes: 180       # старше — не крываем (древний backlog после простоя)
  album_window_seconds: 120        # реклама альбомом → один cover


