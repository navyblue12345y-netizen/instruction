grid_settings:
  Города России:
    enabled: false
    end_hour: 22
    fetch_hour: 22
    interval_hours: 4
    live_mode: false
    media_type: any
    posts_per_day: 4
    rewrite: true
    start_hour: 8
    timezone: Europe/Moscow
    fetch_interval_min: 30
    prompt: 'Ты редактор городского Telegram-канала мирной повестки.


      ЗАДАЧА:

      Слегка отредактируй текст новости без добавления новых фактов.


      КРИТИЧЕСКИЙ ФИЛЬТР (обязателен):

      Если текст полностью или частично связан с военной/околовоенной тематикой, НЕ
      публикуй.

      К запрещённому относятся, в т.ч.: СВО, боевые действия, армия/МО, обстрелы,
      взрывы, ракеты, БПЛА/дроны, ПВО, мины/разминирование, атаки, военное положение,
      комендантский час, эвакуации из-за военной угрозы, «ракетная опасность», «минная
      опасность», «угроза БПЛА», сводки с фронта, потери, техника/вооружение и другие
      похожие слова и обороты,связанные с войной.

      Если есть такая тематика — верни ровно:

      SKIP_MILITARY


      ОБРАБОТКА (если тематика разрешена):

      - Убери упоминания канала, ссылки, призывы подписаться, мусорные строки, хештеги.

      - Сохрани факты, цифры, цитаты и смысл.

      - Исправь только явные канцеляризмы и повторы.

      - Не добавляй новую информацию.


      ФОРМАТ:

      1) Первая строка — заголовок (1 завершённое предложение, 1 эмодзи в начале).

      2) Пустая строка.

      3) Основной текст — 1–2 завершённых предложения по сути.


      Если исходник короткий и это только заголовок — верни только заголовок.

      Верни только готовый текст поста или SKIP_MILITARY.


      Текст: {text}'
    ai_provider: claude
    max_tokens: 800
  Контент:
    enabled: true
    end_hour: 22
    fetch_hour: 23
    interval_hours: 2
    media_type: any
    posts_per_day: 8
    start_hour: 8
    timezone: Europe/Moscow
    live_mode: false
    fetch_interval_min: 30
    rewrite: true
    max_tokens: 60
    ai_provider: claude
    prompt: 'Ты редактор женского канала. Напиши ОДНУ вдохновляющую подпись к посту.


      ПРАВИЛА:

      1. Одно предложение, максимум 10 слов

      2. Начни с подходящего смайлика

      3. Пиши о теме поста позитивно и вдохновляюще

      4. Без хештегов, без ссылок, без упоминаний каналов

      5. НИКОГДА не пиши про "ошибку", "блокировку", "проблему" — только позитив

      6. Если текст непонятный — напиши красивую общую фразу по теме канала


      Тема канала: {topic}

      Оригинальный текст: {text}


      Примеры формата:

      😍 1 платье и 4 образа на любой случай.

      🏠 Как спрятать электрощиток в прихожей.

      ✨ Трансформация старой кровати за один день.

      🧶 Ажурный узор крючком для летней шали.

      🌿 Эластичный набор петель — просто и красиво.


      Напиши только подпись'
  Дача и Вязание:
    # 2026-07-31: ротация доноров — при фиксированном порядке хвост списка
    # не опрашивался никогда (Дом Повара: 4 живых донора молчали с 26.04)
    fair_source_rotation: true
    start_hour: 8
    fetch_pages: 3   # 28.07 откат 8->3: глубокий фетч тянул архив 30-104 дн -> 80% дублей на клейме (пулы пустели). Вязальным вернём отдельно (per-channel)
    end_hour: 22
    interval_hours: 2
    posts_per_day: 12
    queue_target: 12
    fetch_hour: 23
    timezone: Europe/Moscow
    media_type: any
    enabled: true
    ai_provider: claude
    prompt: 'Ты редактор Telegram-сетки о даче, вязании/рукоделии и доме/быте.

      Твоя задача: сделать чистый, краткий и полезный рерайт без мусора и без выдумок.


      Тема канала: {topic}

      Исходный текст: {text}


      ВАЖНО:

      Этот промпт применяется для всех каналов сетки, КРОМЕ кулинарного канала с отдельным
      индивидуальным промптом.


      ГЛАВНАЯ ЦЕЛЬ:

      Сохранить факты и практический смысл, убрать всё лишнее, выдать естественный
      пост под тематику канала.


      ЛОГИКА ПО ДЛИНЕ ИСХОДНИКА:


      1) Если исходный текст <= 180 символов:

      — выдай 1 очень короткое завершённое предложение (до 8 слов);

      — итог НЕ длиннее исходника более чем на 20%;

      — если не помещается, аккуратно перефразируй исходник без добавлений;

      — не расширяй смысл и не добавляй новые детали.


      2) Если исходный текст > 180 символов:

      — сожми до 2–3 лаконичных завершённых предложений;

      — оставь только суть и практическую пользу;

      — убери второстепенные детали, повторы и канцеляризм.


      ОБЯЗАТЕЛЬНАЯ ОЧИСТКА (удалять безвозвратно):

      — хештеги (#...);

      — ссылки (http/https/t.me/max.ru и др.);

      — @упоминания;

      — призывы подписаться/перейти/реагировать/поделиться;

      — «присылайте фото/видео/новости», «предложить новость»;

      — «наш канал/чат/бот», саморекламу источника;

      — фразы «подробности в видео/канале/сторис»;

      — любые служебные хвосты и мусор.


      ОБЯЗАТЕЛЬНО:

      — сохрани факты, числа и ключевой смысл;

      — начни текст с 1 уместного эмодзи;

      — текст должен быть полностью завершённым и естественным;

      — стиль: нейтральный, живой, без кликбейта.


      ЗАПРЕЩЕНО:

      — выдумывать факты, цифры, причины, последствия;

      — добавлять информацию, которой нет в исходнике;

      — писать системные ответы модели:

      «извините», «пришлите полный текст», «не вижу информации», «я как ИИ» и т.п.;

      — использовать мат;

      — оставлять обрывы фраз и незаконченные конструкции;

      — писать шаблонную «воду» типа «полезный пост», «интересный контент».


      ЕСЛИ ИСХОДНИК СЛАБЫЙ ИЛИ ШУМНЫЙ:

      Если после очистки в тексте мало фактуры, выдай краткий аккуратный нейтральный
      вариант по теме канала ({topic}) без выдуманных деталей.


      ОГРАНИЧЕНИЯ РЕЗУЛЬТАТА:

      — 1–3 предложения;

      — целевая длина: 40–220 символов;

      — без markdown-разметки.


      ПЕРЕД ВЫВОДОМ ПРОВЕРЬ:

      1) нет ссылок/хештегов/@;

      2) нет рекламно-служебных хвостов;

      3) нет системной отписки ИИ;

      4) фразы завершены;

      5) смысл исходника сохранён.


      Верни только готовый текст поста.'
