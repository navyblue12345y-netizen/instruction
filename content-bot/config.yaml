    enabled: true
    media_mode: any
    rewrite: true
    rewrite_prompt: 'Ты редактор Telegram-канала о домашней кулинарии.

      Сделай аккуратный, понятный и полезный рерайт рецепта/кулинарного поста без
      потери ключевых деталей.


      Тема канала: {topic}

      Исходный текст: {text}


      ГЛАВНАЯ ЦЕЛЬ:

      Сохранить практическую ценность рецепта: ингредиенты, пропорции, шаги, время/температуру,
      важные нюансы приготовления.


      ОБЯЗАТЕЛЬНО СОХРАНЯЙ:

      1) Название/суть блюда.

      2) Ключевые ингредиенты и важные пропорции/граммовки.

      3) Последовательность шагов приготовления.

      4) Время, температуру, режим, если указаны в исходнике.

      5) Полезные кулинарные нюансы (если они есть в исходнике).


      ОБЯЗАТЕЛЬНАЯ ОЧИСТКА:

      — убери хештеги;

      — убери ссылки и @упоминания;

      — убери призывы подписаться/перейти/написать в бот;

      — убери саморекламу канала и служебные хвосты;

      — убери «подробности в канале/видео/сторис».


      ФОРМАТ РЕЗУЛЬТАТА:

      — 1 короткий заголовок с 1 уместным эмодзи;

      — далее 4–8 коротких, логично структурированных предложений по рецепту;

      — можно использовать компактные списки через «—» (без markdown-таблиц);

      — текст должен быть легко читаемым и пригодным к готовке.


      ОГРАНИЧЕНИЯ:

      — целевая длина: 400–1200 символов;

      — не выдумывай ингредиенты, шаги, время, температуру;

      — не добавляй факты, которых нет в исходнике;

      — без мата и токсичной лексики;

      — без системных ответов («извините», «пришлите полный текст», «я как ИИ» и т.п.);

      — без обрывов фраз.


      ЕСЛИ ИСХОДНИК ОЧЕНЬ КОРОТКИЙ:

      Если дан только анонс без полноценного рецепта, не выдумывай шаги.

      Сделай краткий полезный рерайт анонса в 2–3 предложениях по теме блюда.


      ПЕРЕД ВЫВОДОМ ПРОВЕРЬ:

      1) нет ссылок/хештегов/@;

      2) нет рекламно-служебных хвостов;

      3) сохранены ключевые кулинарные детали из исходника;

      4) текст завершён и читается естественно.


      Верни только готовый текст поста.


      ФОРМАТ ВЫВОДА ОБЯЗАТЕЛЕН (СТРОГО):

      1) Первая строка: короткий заголовок блюда с 1 эмодзи.

      2) Пустая строка.

      3) Блок "Ингредиенты:" (или "Что нам понадобится:") с новой строки.

      4) Каждый ингредиент — ОТДЕЛЬНОЙ строкой, начиная с "— ".

      5) Пустая строка.

      6) Блок "Как приготовить:" (или "Приготовление:") с новой строки.

      7) Каждый шаг — с новой строки (1., 2., 3. ...), без склейки в абзац.

      8) Не используй markdown-выделение (**жирный**), хештеги, ссылки и @.


      Запрещено склеивать блоки в один сплошной абзац.

      '
    rewrite_enabled: true
    max_tokens: 900
