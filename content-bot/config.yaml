    - {code: contact_request, desc: "обращение к читателям с просьбой выйти на связь и КОНТАКТОМ для этого: «просят откликнуться/позвонить/сообщить/обратиться» + телефон, почта, личка; розыск и установление личности; поиск свидетелей и очевидцев ДТП или преступления; «информаторам гарантируется анонимность/конфиденциальность»; объявления о поиске владельцев находки. НЕ относится: справочные телефоны служб в новости (диспетчерская, горячая линия при аварии), номер 112/102 как фон сюжета без призыва к читателю; отчёты о раскрытии — разыскиваемый УЖЕ задержан/найден, никого искать не просят"}
    - {code: fundraising, desc: "АДРЕСНЫЙ сбор денег: пост просит перевести средства конкретному человеку или семье (на лечение, операцию, реабилитацию, после пожара) и даёт КАНАЛ ДЛЯ ПЕРЕВОДА — реквизиты карты, номер телефона, ссылку на сбор, контакт для связи. НЕ относится: городские и школьные благотворительные акции без просьбы о деньгах (сбор канцелярии, вещей, «Собери ребёнка в школу»), новости о работе фондов и волонтёров, отчёты о собранной помощи, гуманитарная помощь от властей"}
    - {code: ad, desc: "реклама под видом новости; скидки, промокоды, заказать, товары"}
    - {code: brand_promo, desc: "нативная реклама компании: пост рассказывает о продукте, услуге, тарифе, приложении, сервисе или модернизации сети КОНКРЕТНОЙ коммерческой компании (банк, оператор связи, ритейлер, маркетплейс, застройщик, автодилер) и перечисляет её преимущества или достижения — даже если нет слов «купить», «скидка», «промокод» и нет пометки «реклама». Признаки: компания — главный герой текста; список плюсов услуги; статистика самой компании («трафик вырос на 25%», «уже в 30 городах», «к концу года будет 500»); текст написан по пресс-релизу компании. НЕ относится: новость, где компания лишь место или объект происшествия (авария на заводе, ограбление банка, штраф, суд, закрытие предприятия, сокращения); сообщения госорганов и муниципальных служб; оснащение и ремонт государственных учреждений — больниц, школ, детсадов, ФАПов (это городская новость, а не реклама поставщика); работа городского транспорта и коммунальных служб"}
    - {code: war, desc: "военная тематика: СВО, ВСУ, мобилизация, фронт, боевые действия, госизмена"}
    - {code: gambling, desc: "казино, ставки, букмекеры, азартные игры"}
    - {code: esoteric, desc: "гороскопы, астрология, гадания, магия, эзотерика"}
    - {code: agitation, desc: "партийная агитация и пиар ЛЮБОЙ партии: Единая Россия, ЛДПР, КПРФ, Справедливая Россия, Новые люди и др. (акции, встречи, инициативы, предвыборный пиар)"}
    - {code: lifehack, desc: "лайфхаки, советы-инструкции, рецепты и кулинарные подборки, обзоры-подборки (самые вкусные/лучшие/топ-N), развлекательный evergreen-контент без городского инфоповода — не новость"}
    - {code: elections, desc: "выборы Госдумы 18-20.09.2026 и вся выборная тематика: регистрация кандидатов, работа ЦИК/избиркомов, агитационный период, дни голосования, волонтёры/наблюдатели на выборах, бюллетени, участки"}
    - {code: missing, desc: "пропавшие или розыск людей, животных, вещей; и итоги поиска (найден живым/мёртвым); НЕ относится: преступник, находившийся в розыске, УЖЕ задержан/пойман — это обычная криминальная новость"}
    - {code: nudity, desc: "нагота: голые или обнажённые люди на фото, видео или в сюжете (голым бегал/ходил, разделся на публике, эксгибиционизм)"}
    - {code: obituary, desc: "некролог: сообщение о смерти человека с прощанием/панихидой/соболезнованиями"}
    - {code: negative_world, desc: "негативные мировые новости: катастрофы, трагедии, насилие за рубежом"}
    - {code: stale_event, desc: "протухшая оперативка: УЖЕ ЗАВЕРШИВШЕЕСЯ кратковременное событие — отключение света/воды/тепла с обещанием восстановить за N часов, когда пост старше этого срока; «прямо сейчас идёт» событие вчерашнего дня. Сверяй возраст поста с текущим временем. НЕ относится к АНОНСАМ будущих событий (завтра/в выходные перекроют, отключат — актуально даже во вчерашнем посте) и к долгосрочным последствиям"}
  curation:
    enabled: true
    backend: deepseek
    max_candidates_considered: 20
    max_tokens: 1500
  moderation:
